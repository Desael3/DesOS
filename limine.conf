# Limine 引导配置文件 —— DesOS
# 位置：打包进 ISO 根目录 /limine.conf（由 tools/build_iso.py 拷贝）
# 语法参考：tools/limine/limine-12.9.6/CONFIG.md
#
# 重要（Limine 12.x 配置语法）：
#   1) 注释以 # 开头，且必须单独成行。
#   2) 选项是 "option_name: value" 形式（分隔符是冒号，不是等号；12.x 已改语法）。
#   3) 菜单项以 "/" 开头（旧版的 ":" 已失效）。
#   4) 全局选项必须位于第一个菜单项之前。
#   5) 本文件在打包进 ISO 时会被统一转换为 LF 行尾（CRLF 会干扰解析）。

# ===== 全局选项 =====
# 3 秒后自动启动默认项（显示菜单，便于人工选择；QEMU 自动测试也会自动引导）
timeout: 3
# 打印额外引导信息，便于早期排错
verbose: yes
# 启用串口终端：菜单/引导信息/内核串口输出/报错都经 COM1，可用 -nographic 捕获
serial: yes
# 默认启动第 1 个菜单项
default_entry: 1

# ===== 菜单项 =====
/DesOS
    comment: DesOS (Limine native protocol)
    protocol: limine
    # boot() 指向存放本配置文件的启动介质（ISO 整卷）
    path: boot():/kernel.elf
    # 帧缓冲分辨率 <宽>x<高>x<bpp>
    resolution: 1024x768x32
